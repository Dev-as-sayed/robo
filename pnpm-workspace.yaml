packages:
  - "apps/*"
  - "packages/*"
  - "firmware/*"

nodeLinker: hoisted
strictPeerDependencies: false

allowBuilds:
  unrs-resolver: true
  "@sentry/cli": true
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  bcrypt: true
  esbuild: true
  # CPU binaries ship in the package; the postinstall only fetches GPU extras.
  onnxruntime-node: false
  prisma: true
  tesseract.js: true

overrides:
  tar: ^7.5.19
