name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: .

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/server/pnpm-lock.yaml
      - run: pnpm --dir apps/server install --frozen-lockfile
      - run: pnpm --dir apps/server db:generate
      - run: pnpm --dir apps/server lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/server/pnpm-lock.yaml
      - run: pnpm --dir apps/server install --frozen-lockfile
      - run: pnpm --dir apps/server db:generate
      - run: pnpm --dir apps/server typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/server/pnpm-lock.yaml
      - run: pnpm --dir apps/server install --frozen-lockfile
      - run: pnpm --dir apps/server db:generate
      - run: pnpm --dir apps/server test
      - run: pnpm --dir apps/server ai:regression
      - run: pnpm --dir apps/server retrieval:eval
      - run: pnpm --dir apps/server embeddings:benchmark

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/server/pnpm-lock.yaml
      - run: pnpm --dir apps/server install --frozen-lockfile
      - run: pnpm --dir apps/server db:generate
      - run: pnpm --dir apps/server build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir apps/mobile typecheck
      - run: pnpm --dir apps/mobile lint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m py_compile services/voice/stt/app.py services/voice/tts/app.py services/voice/tts/download_voice.py

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t robo-stt:ci ./services/voice/stt
      - run: docker build -t robo-tts:ci ./services/voice/tts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            apps/server/pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/server install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir apps/server audit --audit-level critical
      - run: pnpm --dir apps/mobile audit --audit-level critical

  api-image:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t robo-api:ci .
