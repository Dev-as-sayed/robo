name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: .

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter robo-server...
      - run: pnpm --filter robo-server db:generate
      - run: pnpm --filter robo-server lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter robo-server...
      - run: pnpm --filter robo-server db:generate
      - run: pnpm --filter robo-server typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter robo-server...
      - run: pnpm --filter robo-server db:generate
      - run: pnpm --filter robo-server test
      - run: pnpm --filter robo-server ai:regression
      - run: pnpm --filter robo-server retrieval:eval
      - run: pnpm --filter robo-server embeddings:benchmark

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgresql://robo:robo@localhost:5432/robo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter robo-server...
      - run: pnpm --filter robo-server db:generate
      - run: pnpm --filter robo-server build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter robo-mobile...
      - run: pnpm --filter robo-mobile typecheck
      - run: pnpm --filter robo-mobile lint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile services/voice/stt/app.py services/voice/tts/app.py services/voice/tts/download_voice.py
      - run: bash -n scripts/backup-db.sh scripts/services/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
