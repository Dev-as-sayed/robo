version: "3.8"

services:

  # PostgreSQL - Relational database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robo
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env

  # Redis - For BullMQ and caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # MinIO - S3-compatible storage for files
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address "0.0.0.0:9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  # Ollama - Local LLM service
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Speech-to-text - faster-whisper (PCM16)
  stt:
    build:
      context: ./services/voice/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /models
    volumes:
      - stt_models:/models
    ports:
      - "8001:8001"

  # Text-to-speech - Piper (PCM16)
  tts:
    build:
      context: ./services/voice/tts
    restart: unless-stopped
    environment:
      TTS_VOICE: ${TTS_VOICE:-en_US-lessac-medium}
      TTS_DATA_DIR: /models
    volumes:
      - tts_models:/models
    ports:
      - "8002:8002"

  # Langfuse - AI observability
  langfuse:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    environment:
      PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - "5540:5540"
      - "5555:5555"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  stt_models:
  tts_models: