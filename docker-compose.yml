version: "3.8"

services:

  # PostgreSQL - Relational database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robo
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env

  # Redis - For BullMQ and caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # MinIO - S3-compatible storage for files
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address "0.0.0.0:9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  # Creates the configured bucket once MinIO is ready.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: ${S3_BUCKET:-robo-storage}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  # Ollama - Local LLM service
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Pulls the configured chat and embedding models once the Ollama API is ready.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "waiting for ollama..."
          sleep 2
        done
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
    restart: "no"

  # Speech-to-text - faster-whisper (PCM16)
  stt:
    build:
      context: ./services/voice/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - stt_models:/models
    ports:
      - "8001:8001"

  # Text-to-speech - Piper (PCM16)
  tts:
    build:
      context: ./services/voice/tts
    restart: unless-stopped
    environment:
      TTS_VOICE: ${TTS_VOICE:-en_US-lessac-medium}
      TTS_VOICES: ${TTS_VOICES:-en_US-lessac-medium,hi_IN-pratham-medium}
      TTS_VOICE_MAP: ${TTS_VOICE_MAP:-en:en_US-lessac-medium,hi:hi_IN-pratham-medium}
      TTS_DATA_DIR: /models
      PIPER_VOICE_BASE_URL: ${PIPER_VOICE_BASE_URL:-https://hf-mirror.com}
    volumes:
      - tts_models:/models
    ports:
      - "8002:8002"

  # Langfuse - AI observability
  langfuse:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    environment:
      PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - "5540:5540"
      - "5555:5555"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  stt_models:
  tts_models: