services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://robo:${POSTGRES_PASSWORD}@db:5432/robo
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-robo-storage}
      OLLAMA_BASE_URL: http://ollama:11434
      STT_SERVICE_URL: http://stt:8001
      TTS_SERVICE_URL: http://tts:8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robo
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robo -d robo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-robo-storage}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  ollama:
    image: ollama/ollama:0.11.3
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.11.3
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
    restart: "no"

  stt:
    build:
      context: ./services/voice/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - stt_models:/models

  tts:
    build:
      context: ./services/voice/tts
    restart: unless-stopped
    environment:
      TTS_VOICE: ${TTS_VOICE:-en_US-lessac-medium}
      TTS_VOICES: ${TTS_VOICES:-en_US-lessac-medium,hi_IN-pratham-medium}
      TTS_VOICE_MAP: ${TTS_VOICE_MAP:-en:en_US-lessac-medium,hi:hi_IN-pratham-medium}
      TTS_DATA_DIR: /models
      PIPER_VOICE_BASE_URL: ${PIPER_VOICE_BASE_URL:-https://hf-mirror.com}
    volumes:
      - tts_models:/models

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  stt_models:
  tts_models:
